name: Deploy static content to Pages

on:
  push:
    branches:
      - "claude/boolean-search-recruiter-site-LfM95"
      - "claude/ai-recruiting-agent-yxisy"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: API-Konfiguration einbinden
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "window.ANTHROPIC_CONFIG = { apiKey: '${{ secrets.ANTHROPIC_API_KEY }}', model: 'claude-sonnet-4-6' };" > config.js
            echo "config.js erstellt (API-Key aus Secret)"
          else
            echo "/* Kein ANTHROPIC_API_KEY Secret gesetzt – Nutzer geben den Key selbst ein */" > config.js
            echo "config.js erstellt (leer, kein Secret vorhanden)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
